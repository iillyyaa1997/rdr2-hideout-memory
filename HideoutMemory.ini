[HideoutMemory]
; 1 = keep Bandit Hideouts skulls hidden until you have been near the hideout, then keep them shown
;     (needs ALWAYS_SHOW_HIDEOUT_BLIP=1 in Bandit_Hideouts.ini)
Enabled=1
; metres: how close you have to come for a hideout to count as visited
Radius=150
; 1 = a visited hideout gets a map icon that highlights under the cursor and opens the game's
;     hideout card; 0 = show the Bandit Hideouts skull itself
OwnBlips=1
; 1 = bandits from Bandit Hideouts are called "Бандит" (their horses "Лошадь бандита") when you aim at
;     them or focus on them, so you can tell them from townsfolk; hostages and hired guns are left alone
BanditNames=1
; dollars for every Bandit Hideouts bandit killed: replaces the random $REWARD_MIN-$REWARD_MAX it pays for a cleared
;     hideout (instant reward, REWARD_AT_POST_OFFICE=0); 0 = leave its own amount
RewardPerBandit=10
